<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<title>Character preview</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="characters.js"></script>
<style>*{margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#e9eaec}#root{position:relative;width:1920px;height:1080px;background:#e9eaec}canvas{position:absolute;inset:0}</style>
</head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080" data-fps="30"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
THREE.ColorManagement.legacyMode = false;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
r.setSize(1920, 1080, false); r.outputEncoding = THREE.sRGBEncoding; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#e9eaec");
const cam = new THREE.PerspectiveCamera(22, 1920 / 1080, 0.1, 200); cam.position.set(0, 3.4, 24); cam.lookAt(0, 2.7, 0);
scene.add(new THREE.HemisphereLight("#ffffff", "#b9b2a8", 0.7));
const key = new THREE.DirectionalLight("#fff6ea", 1.0); key.position.set(-6, 12, 14); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -15, right: 15, top: 10, bottom: -4 }); key.shadow.radius = 6; scene.add(key);
const fill = new THREE.DirectionalLight("#eef4ff", 0.35); fill.position.set(8, 5, 10); scene.add(fill);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.ShadowMaterial({ opacity: 0.18 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const place = (c, x, ry) => { c.root.position.x = x; c.root.rotation.y = ry; scene.add(c.root); return c; };
place(Chars.buildMo(), -6.8, 0); place(Chars.buildMo(), -3.2, -0.6);
place(Chars.buildGrandpa(), 1.6, 0); place(Chars.buildGrandpa(), 6.2, -0.6);
const tl = gsap.timeline({ paused: true }); const clock = { t: v => { r.render(scene, cam); return 0; } };
tl.to({}, { duration: 2, onUpdate: () => r.render(scene, cam) }, 0); window.__timelines["main"] = tl; r.render(scene, cam);
</script></body></html>
